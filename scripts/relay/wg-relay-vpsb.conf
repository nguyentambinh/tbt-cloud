# Nguyễn Tâm Bình - 2324801030003
# Trạm chuyển tiếp IPv4 công cộng (VPS B): nhận cổng từ Internet, chuyển qua WireGuard về node nhà sau CGNAT
# Đặt tại /etc/wireguard/wg-relay.conf; khóa riêng ở /etc/wireguard/relay.key (quyền 600)
[Interface]
Address = 10.99.0.1/24
ListenPort = 51820
PostUp = wg set %i private-key /etc/wireguard/relay.key
PostUp = iptables -I INPUT 1 -i ens192 -p udp --dport 51820 -j ACCEPT
PostUp = iptables -t nat -N TBT_RELAY; iptables -t nat -A TBT_RELAY -p tcp --dport 22000:23999 -j DNAT --to-destination 10.99.0.2; iptables -t nat -A TBT_RELAY -p tcp --dport 18000 -j DNAT --to-destination 10.99.0.2:8000
PostUp = iptables -t nat -I PREROUTING 1 -i ens192 -j TBT_RELAY
PostUp = iptables -t nat -I POSTROUTING 1 -o %i -j MASQUERADE
PostUp = iptables -I FORWARD 1 -i ens192 -o %i -j ACCEPT; iptables -I FORWARD 1 -i %i -o ens192 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
# Ép MSS theo MTU đường hầm (1420): bắt tay TLS của RDP có gói lớn, không ép thì bị rơi
PostUp = iptables -t mangle -I FORWARD 1 -o %i -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu; iptables -t mangle -I FORWARD 1 -i %i -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
PostDown = iptables -D INPUT -i ens192 -p udp --dport 51820 -j ACCEPT
PostDown = iptables -t nat -D PREROUTING -i ens192 -j TBT_RELAY; iptables -t nat -F TBT_RELAY; iptables -t nat -X TBT_RELAY
PostDown = iptables -t nat -D POSTROUTING -o %i -j MASQUERADE
PostDown = iptables -D FORWARD -i ens192 -o %i -j ACCEPT; iptables -D FORWARD -i %i -o ens192 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
PostDown = iptables -t mangle -D FORWARD -o %i -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu; iptables -t mangle -D FORWARD -i %i -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

